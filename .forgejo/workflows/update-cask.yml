name: Cask bijhouden
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed macOS release (empty selects latest)
        required: false
        default: ''
      operation_id:
        description: Durable caller nonce for an explicit update
        required: false
        default: ''
      pin:
        description: Keep this rollback target until the next explicit normal publication
        required: false
        default: 'false'
concurrency:
  group: homebrew-channel-main
  cancel-in-progress: false
jobs:
  validate:
    runs-on: docker
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate selector and checked-in cask
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends ruby minisign
          python3 -m unittest discover -s scripts -p 'test_*.py'
          ruby -c Casks/ocideck.rb
  cask:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: docker
    timeout-minutes: 30
    container:
      image: pawprint.vigilis.online/librekat/ocideck-ci:flutter-3.47.7@sha256:9fb20e45072635824e4a8dd0895b7cbe172bd3b063ef65fd5ad08b3127e177c2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
      - name: Prepare verification tools
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends minisign ruby
      - name: Verify and update selected macOS pointer
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          OPERATION_ID: ${{ inputs.operation_id }}
          PIN: ${{ inputs.pin }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git rev-parse HEAD)"
          WORK="$(mktemp -d)"
          trap 'rm -rf -- "$WORK"' EXIT
          case "$PIN" in ''|false) PIN_ARGS=();; true) PIN_ARGS=(--pin);; *) exit 2;; esac
          python3 scripts/update_channel.py --tag "${RELEASE_TAG:-}" --operation-id "${OPERATION_ID:-}" "${PIN_ARGS[@]}" --output "$WORK/result.json"
          ruby -c Casks/ocideck.rb
          git diff --check
          test -z "$(git diff --name-only -- . ':!Casks/ocideck.rb' ':!channel-policy.json')"
          UNTRACKED="$(git ls-files --others --exclude-standard)"
          [[ -z "$UNTRACKED" || "$UNTRACKED" = channel-policy.json ]]
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          if ! git diff --quiet -- Casks/ocideck.rb channel-policy.json || [ "$UNTRACKED" = channel-policy.json ]; then
            git config user.name 'OciDeck release'
            git config user.email release@librekat.nl
            git add -A -- Casks/ocideck.rb
            if [ -e channel-policy.json ] || git ls-files --error-unmatch channel-policy.json >/dev/null 2>&1; then
              git add -A -- channel-policy.json
            fi
            git commit -m "Update verified macOS release pointer"
            git push origin HEAD:refs/heads/main
          fi
          mkdir -p homebrew-receipt
          COMMIT="$(git rev-parse HEAD)"
          export COMMIT
          python3 - "$WORK/result.json" <<'PYRECEIPT'
          import json, os, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text())
          value['commit'] = os.environ['COMMIT']
          pathlib.Path('homebrew-receipt/homebrew-channel.json').write_text(json.dumps(value, sort_keys=True) + '\n')
          PYRECEIPT
      - name: Preserve exact policy and cask receipt
        if: ${{ inputs.operation_id != '' }}
        uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        with:
          name: homebrew-channel-${{ inputs.operation_id }}
          path: homebrew-receipt/homebrew-channel.json
          if-no-files-found: error
          retention-days: 90
